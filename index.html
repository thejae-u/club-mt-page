<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>빅이큐 MT - 접속 중...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f6fb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #2d468d;
        }
        .loader-container {
            text-align: center;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2d468d;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="loader"></div>
        <p id="status-text">잠시만 기다려 주세요...</p>
    </div>

    <script>
        /**
         * 설정 가이드:
         * 1. TARGET_DATE_STR: 사이트가 자동으로 전환될 날짜와 시간을 입력하세요. (ISO 8601 형식)
         * 2. USE_SERVER_TIME: 사용자의 컴퓨터 시간 대신 서버 시간을 사용할지 여부 (true 권장)
         */
        const TARGET_DATE_STR = '2026-06-18T00:00:00+09:00'; 
        const USE_SERVER_TIME = true; 


        async function getNow() {
            if (USE_SERVER_TIME) {
                try {
                    const response = await fetch('https://worldtimeapi.org/api/timezone/Asia/Seoul');
                    if (response.ok) {
                        const data = await response.json();
                        return new Date(data.datetime).getTime();
                    }
                } catch (e) {
                    console.warn("서버 시간을 가져올 수 없어 로컬 시간을 사용합니다.", e);
                }
            }
            return new Date().getTime();
        }

        async function route() {
            const targetTime = new Date(TARGET_DATE_STR).getTime();
            const nowTime = await getNow();

            // 테스트를 위한 로그 (개발자 도구 콘솔에서 확인 가능)
            console.log("현재 시각:", new Date(nowTime).toLocaleString());
            console.log("목표 시각:", new Date(targetTime).toLocaleString());

            if (nowTime >= targetTime) {
                // 오픈 시간이 지났으면 실제 사이트로 이동 (경로 난독화 처리)
                const path = atob('Li9yZWFsX3Y1X210XzIwMjZfcTh6N3gyL2luZGV4Lmh0bWw=');
                window.location.replace(path);
            } else {
                // 아직 오픈 전이면 프리사이트로 이동
                window.location.replace('./pre/index.html');
            }
        }

        // 실행
        route();
    </script>
</body>
</html>
