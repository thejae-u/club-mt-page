name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# 동일한 워크플로가 동시에 실행되는 것을 방지 (배포 충돌 해결)
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject API URL Secret
        run: |
          echo "Current API_BASE line in app.js:"
          grep "const API_BASE" js/app.js
          
          if [ -z "${{ secrets.API_BASE_URL }}" ]; then
            echo "::error::API_BASE_URL secret is NOT SET. Please check Repository Settings > Secrets > Actions."
            exit 1
          fi
          
          echo "Replacing API_BASE_URL_PLACEHOLDER with secret value..."
          # 작은따옴표를 포함하여 통째로 치환하여 더 안전하게 처리합니다.
          sed -i "s|'API_BASE_URL_PLACEHOLDER'|'${{ secrets.API_BASE_URL }}'|g" js/app.js
          
          echo "Verification (Full Line):"
          grep "const API_BASE" js/app.js | sed 's|https://[^/]*|https://***|g'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 현재 디렉토리(루트) 전체를 업로드
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
