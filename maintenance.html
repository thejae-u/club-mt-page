<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서버 점검 중</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --accent: #6366f1;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(99, 102, 241, 0.15);
        }
        
        body {
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-primary);
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Subtle moving grid background for rich aesthetics */
        .background-animation {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: linear-gradient(rgba(99, 102, 241, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(99, 102, 241, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: rotate(15deg);
            animation: moveGrid 120s linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes moveGrid {
            0% { transform: rotate(15deg) translate(0, 0); }
            100% { transform: rotate(15deg) translate(-1000px, -1000px); }
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 480px;
            width: 90%;
            text-align: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3),
                        0 0 50px rgba(99, 102, 241, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 50%;
            border: 1.5px solid rgba(99, 102, 241, 0.3);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .icon-wrapper svg {
            width: 48px;
            height: 48px;
            fill: none;
            stroke: var(--accent);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Pulsing indicator light */
        .pulse-dot {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 14px;
            height: 14px;
            background: #ef4444;
            border: 2px solid #0f172a;
            border-radius: 50%;
        }

        .pulse-dot::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            width: 14px;
            height: 14px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 2s infinite;
            opacity: 0.8;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }
            100% {
                transform: scale(2.2);
                opacity: 0;
            }
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 16px;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-secondary);
            margin: 0 0 32px;
        }

        .btn-retry {
            display: inline-block;
            width: 100%;
            padding: 16px 0;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(99, 102, 241, 0.35);
        }

        .btn-retry:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 24px;
            font-size: 11px;
            color: rgba(148, 163, 184, 0.4);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Mobile Responsive Adjustments */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                border-radius: 20px;
            }
            .icon-wrapper {
                width: 75px;
                height: 75px;
                margin-bottom: 20px;
            }
            .icon-wrapper svg {
                width: 38px;
                height: 38px;
            }
            h1 {
                font-size: 20px;
                margin-bottom: 12px;
            }
            p {
                font-size: 13.5px;
                line-height: 1.5;
                margin-bottom: 24px;
            }
            .btn-retry {
                padding: 14px 0;
                font-size: 14px;
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="background-animation"></div>
    <div class="container">
        <div class="icon-wrapper">
            <svg viewBox="0 0 24 24">
                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
            </svg>
            <div class="pulse-dot"></div>
        </div>
        
        <h1>서버 점검 및 업데이트 중</h1>
        <p>
            서버 점검 중입니다. 공지를 확인해 주세요.<br>
            안정적인 서비스를 위한 업데이트 작업이 진행 중입니다.<br>
            <span style="display: block; margin-top: 14px; font-size: 13px; color: #f87171; font-weight: 500;">
                ⚠️ 문제 발생 시 관리자에게 문의해주세요.
            </span>
        </p>

        <button class="btn-retry" onclick="checkServer()">🔄 다시 연결 시도하기</button>
        <div class="footer">System Maintenance Mode</div>
    </div>

    <script>
        const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? '/api' : 'https://api-mt.thejaeu.com/api';
        const API_STATUS_URL = `${API_BASE}/Settings/open-status?_=${new Date().getTime()}`;

        async function checkServer() {
            const btn = document.querySelector('.btn-retry');
            const originalText = btn.textContent;
            btn.textContent = "⏳ 연결 확인 중...";
            btn.disabled = true;

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 2500);

            try {
                const response = await fetch(API_STATUS_URL, { 
                    headers: { 'X-ClubMT-Source': 'WebApp' },
                    referrerPolicy: "origin",
                    signal: controller.signal
                });

                if (response.ok) {
                    // Server is back online, redirect to main router page
                    window.location.replace('./index.html');
                } else {
                    alert("서버가 아직 점검 중입니다. 잠시 후 다시 시도해 주세요.");
                    btn.textContent = originalText;
                    btn.disabled = false;
                }
            } catch (e) {
                alert("서버에 연결할 수 없습니다. 점검이 완료될 때까지 기다려 주세요.");
                btn.textContent = originalText;
                btn.disabled = false;
            } finally {
                clearTimeout(timeoutId);
            }
        }
    </script>
</body>
</html>
