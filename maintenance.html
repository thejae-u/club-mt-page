<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>빅이큐 MT</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #2e1065 100%);
            --accent: #f472b6; /* 따뜻한 핑크/로즈 계열 */
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --card-bg: rgba(30, 41, 59, 0.75);
            --card-border: rgba(244, 114, 182, 0.15);
        }
        
        body {
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-primary);
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Subtle moving grid background for rich aesthetics */
        .background-animation {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: linear-gradient(rgba(244, 114, 182, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(244, 114, 182, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: rotate(15deg);
            animation: moveGrid 120s linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes moveGrid {
            0% { transform: rotate(15deg) translate(0, 0); }
            100% { transform: rotate(15deg) translate(-1000px, -1000px); }
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 480px;
            width: 90%;
            text-align: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 50px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3),
                        0 0 50px rgba(244, 114, 182, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(244, 114, 182, 0.1);
            border-radius: 50%;
            border: 1.5px solid rgba(244, 114, 182, 0.3);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .icon-wrapper svg {
            width: 44px;
            height: 44px;
            fill: none;
            stroke: var(--accent);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Pulsing indicator light - warm amber sparkle */
        .pulse-dot {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background: #fbbf24;
            border: 2px solid #0f172a;
            border-radius: 50%;
        }

        .pulse-dot::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            width: 12px;
            height: 12px;
            background: #fbbf24;
            border-radius: 50%;
            animation: pulse 2s infinite;
            opacity: 0.8;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }
            100% {
                transform: scale(2.5);
                opacity: 0;
            }
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin: 0 0 12px;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #fbcfe8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 18px;
            font-weight: 600;
            color: #f472b6;
            margin-bottom: 24px;
        }

        p {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-secondary);
            margin: 0;
        }

        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(244, 114, 182, 0.2), transparent);
            margin: 24px 0;
        }

        .thanks-msg {
            font-size: 13px;
            color: #94a3b8;
            font-style: italic;
        }

        .footer {
            margin-top: 16px;
            font-size: 11px;
            color: rgba(148, 163, 184, 0.4);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Mobile Responsive Adjustments */
        @media (max-width: 480px) {
            .container {
                padding: 40px 20px;
                border-radius: 20px;
            }
            .icon-wrapper {
                width: 80px;
                height: 80px;
                margin-bottom: 24px;
            }
            .icon-wrapper svg {
                width: 38px;
                height: 38px;
            }
            h1 {
                font-size: 22px;
                margin-bottom: 10px;
            }
            .subtitle {
                font-size: 16px;
                margin-bottom: 20px;
            }
            p {
                font-size: 14px;
                line-height: 1.6;
            }
        }
    </style>
</head>
<body>
    <div class="background-animation"></div>
    <div class="container">
        <div class="icon-wrapper">
            <!-- Heart icon showing gratitude and farewell -->
            <svg viewBox="0 0 24 24">
                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
            </svg>
            <div class="pulse-dot"></div>
        </div>
        
        <h1>2026 빅이큐 MT 종료</h1>
        <p>
            2026 빅이큐 MT가 종료됨에 따라<br>
            사이트 이용이 제한됩니다.<br>
            <br>
        <div class="subtitle">다음에 또 봐요!</div>
        </p>

        <div class="divider"></div>
        <div class="thanks-msg">Thank you</div>
        <div class="footer">© 빅이큐MT. All Rights Reserved.</div>
    </div>
</body>
</html>
