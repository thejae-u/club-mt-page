<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>동문 MT 미등록 명단</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏐</text></svg>">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/admin.js" defer></script>
    <style>
        .container { max-width: 100%; margin: 0 auto; padding: 20px; width: 1500px;}
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 24px; color: #2e7ab0; margin: 0; }
        .btn-back { text-decoration: none; font-size: 14px; color: #2e7ab0; font-weight: 600; }
        
        .card { background: white; padding: 0; border-radius: 16px; box-shadow: 0 4px 12px rgba(118,174,217,0.1); overflow: hidden; border: 1px solid var(--border); width: 100%;}
        .table-wrapper { overflow-x: auto; width: 101%; background: #fff; padding-left: 5px; padding-right: 5px;}
        table { width: 100%; border-collapse: collapse; min-width: 1400px; table-layout: auto; }
        th { background: #EEF5FB; padding: 12px 8px; text-align: left; color: #6A9BB5; border-bottom: 2px solid var(--border); cursor: pointer; user-select: none; font-size: 12px; }

        /* Column Widths (Registered Table) */
        #regTable th:nth-child(1) { width: 75px; }   /* 이름 */
        #regTable th:nth-child(2) { width: 50px; }   /* 기수 */
        #regTable th:nth-child(3) { width: 75px; }   /* 구분 */
        #regTable th:nth-child(4) { width: 115px; }  /* 연락처 */
        #regTable th:nth-child(5) { width: 100px; }  /* 학번 */
        #regTable th:nth-child(6) { width: 50px; }   /* 입금 */
        #regTable th:nth-child(7) { width: 90px; }   /* 이동수단 */
        #regTable th:nth-child(8) { width: 70px; }   /* 카풀 */
        #regTable th:nth-child(9) { width: 100px; }  /* 출발지 */
        #regTable th:nth-child(10) { width: 75px; }  /* 면허 */
        #regTable th:nth-child(11) { width: 75px; }  /* 운전가능 */
        #regTable th:nth-child(12) { width: 100px; } /* 경력 */
        #regTable th:nth-child(13) { width: 120px; } /* 알레르기 (Wider & Wrap) */
        #regTable th:nth-child(14) { min-width: 150px; } /* 메모/요청 (Flexible & Wrap) */
        #regTable th:nth-child(15) { width: 100px; } /* 등록일 */

        /* Unregistered Table Specific */
        #unregTable { min-width: 400px; width: 100%; table-layout: fixed; border-top: 2px solid #ddd; }
        #unregTable th:nth-child(1) { width: 40%; border-right: 1px solid var(--border); } /* 기수 */
        #unregTable th:nth-child(2) { width: 60%; } /* 이름 */
        
        #unregTable td:nth-child(1) { border-right: 1px solid #f0f0f0; }
        
        th:hover { background: #EEF4FB; color: var(--blue); }
        th.sort-asc::after { content: ' ↑'; }
        th.sort-desc::after { content: ' ↓'; }
        
        th { text-align: center; white-space: nowrap; font-weight: 800; }
        td { padding: 12px 10px; border-bottom: 1px solid #f0f0f0; font-size: 13px; line-height: 1.4; vertical-align: middle; }
        
        /* Registered Table: Default to center, but specific columns wrap and left-align */
        #regTable td { text-align: center; white-space: nowrap; }
        #regTable td:nth-child(13), 
        #regTable td:nth-child(14) { 
            white-space: normal !important; 
            text-align: left !important; 
            word-break: break-all;
            min-width: 150px;
        }

        /* Unregistered Table: Force center alignment and consistent font */
        #unregTable td {
            text-align: center !important;
            white-space: nowrap !important;
            font-size: 14px;
        }
        #unregTable td b {
            font-weight: 700;
            color: #2D468D;
        }

        tr:hover { background: #fafbfc; }
        
        .badge-reg { background: #e6f7ed; color: #22C55E; }
        .badge-wait { background: #fff4e0; color: #F5A623; }
        .badge-army { background: #e0f2fe; color: #0EA5E9; }

        .search-box { margin-bottom: 15px; display: flex; gap: 10px; align-items: center; }
        .search-box input { padding: 10px 15px; border: 1.5px solid var(--border); border-radius: 10px; flex: 1; font-size: 14px; outline: none; background: #fff; color: #0A141A; }
        .search-box input:focus { border-color: var(--blue); }

        .summary-bar { display: flex; gap: 20px; margin-bottom: 15px; font-size: 13px; font-weight: 600; color: #6A9BB5; }
    </style>
</head>
<body>
    <div id="adminContent" style="visibility: hidden;">
    <div class="container">
        <div class="header">
            <h1>📋 세부 신청자 명단 관리</h1>
            <a href="manager-hq" class="btn-back">← 기본 관리자로 돌아가기</a>
        </div>

        <div class="summary-bar" id="summaryBar">
            <span>총 인원: <span id="totalCount">0</span>명</span>
            <span>신청 완료: <span id="regCount">0</span>명</span>
            <span>입금 완료: <span id="depositCount">0</span>명</span>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="이름, 기수, 연락처, 메모 등으로 검색..." oninput="filterData()">
        </div>

        <h2 style="font-size: 16px; margin: 20px 0 10px; color: #2D468D;">✅ MT 신청 완료 명단</h2>
        <div class="card" style="margin-bottom: 30px;">
            <div class="table-wrapper">
                <table id="regTable">
                    <thead>
                        <tr>
                            <th onclick="sortTable('name')">이름</th>
                            <th onclick="sortTable('generation')">기수</th>
                            <th onclick="sortTable('type')">구분</th>
                            <th onclick="sortTable('phoneNumber')">연락처</th>
                            <th onclick="sortTable('studentId')">학번</th>
                            <th onclick="sortTable('isDepositConfirmed')">입금</th>
                            <th onclick="sortTable('transportation')">이동수단</th>
                            <th onclick="sortTable('carpoolSeats')">카풀</th>
                            <th onclick="sortTable('departureArea')">출발지</th>
                            <th onclick="sortTable('hasDriverLicense')">면허</th>
                            <th onclick="sortTable('canDrive')">운전가능</th>
                            <th onclick="sortTable('drivingExperience')">경력</th>
                            <th onclick="sortTable('allergies')">알레르기</th>
                            <th onclick="sortTable('remarks')">메모/요청</th>
                            <th onclick="sortTable('createdAt')">등록일</th>
                        </tr>
                    </thead>
                    <tbody id="regTableBody"></tbody>
                </table>
            </div>
        </div>

        <h2 style="font-size: 16px; margin: 20px 0 10px; color: #666;">⏳ 미신청자 명단 (마스터 리스트)</h2>
        <div class="card">
            <div class="table-wrapper">
                <table id="unregTable">
                    <thead>
                        <tr>
                            <th onclick="sortTable('generation')">기수</th>
                            <th onclick="sortTable('name')">이름</th>
                        </tr>
                    </thead>
                    <tbody id="unregTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    </div> <!-- End of adminContent -->

    <!-- CUSTOM POPUP MODAL -->
    <div id="modal-alert" style="display:none; position:fixed; inset:0; z-index: 99999; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; padding:20px; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);">
        <div class="card" style="width:100%; max-width: 400px; padding: 24px; border-radius: 16px;">
            <h1 id="alert-title" style="margin-top: 0; margin-bottom: 8px; justify-content: flex-start;">알림</h1>
            <p id="alert-message" style="margin-bottom: 24px; white-space: pre-wrap; line-height: 1.6; font-size: 14px; color: #444;">메시지 내용</p>
            <div id="alert-buttons" style="display: flex; gap: 12px;">
                <button id="btn-alert-confirm" style="margin-top: 0; flex: 1;">확인</button>
                <button id="btn-alert-cancel" style="margin-top: 0; flex: 1; background: #eee; color: #333; display: none;">취소</button>
            </div>
        </div>
    </div>

    <script>
        // Inline Modal Helpers for Admin
        function openModal(id) {
            const el = document.getElementById('modal-' + id) || document.getElementById(id);
            if (el) {
                el.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            }
        }
        function closeModal(id) {
            const el = document.getElementById('modal-' + id) || document.getElementById(id);
            if (el) {
                el.style.display = 'none';
                document.body.style.overflow = '';
            }
        }

        // CUSTOM POPUP SYSTEM
        function showPopup(title, message, isConfirm = false) {
            return new Promise((resolve) => {
                const titleEl = document.getElementById('alert-title');
                const msgEl = document.getElementById('alert-message');
                const btnConfirm = document.getElementById('btn-alert-confirm');
                const btnCancel = document.getElementById('btn-alert-cancel');

                titleEl.textContent = title || '알림';
                msgEl.textContent = message;
                
                btnCancel.style.display = isConfirm ? 'block' : 'none';
                btnConfirm.textContent = isConfirm ? '확인' : '닫기';

                const cleanup = () => {
                    btnConfirm.onclick = null;
                    btnCancel.onclick = null;
                    closeModal('alert');
                };

                btnConfirm.onclick = () => { cleanup(); resolve(true); };
                btnCancel.onclick = () => { cleanup(); resolve(false); };

                openModal('alert');
            });
        }
        window.alert = (msg) => showPopup('알림', msg);
        window.confirm = (msg) => showPopup('확인', msg, true);

        // Define fetchData if it doesn't exist to prevent errors in admin.js checkAuth
        if (typeof window.fetchData !== 'function') {
            window.fetchData = function() {
                if (typeof loadRegisteredData === 'function') loadRegisteredData();
            };
        }
    </script>
</body>
</html>
